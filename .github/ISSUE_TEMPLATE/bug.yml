name: Bug report
description: Report a problem with docusaurus-plugin-dgmo
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Triage hint:** if your symptom looks like one of these, you may be in the wrong repo —
        - "Diagram looks wrong regardless of host site" → file in [`dgmo`](https://github.com/diagrammo/dgmo/issues)
        - "Fenced block isn't being processed at all" → file in [`remark-dgmo`](https://github.com/diagrammo/remark-dgmo/issues)
        - "Color-mode toggle doesn't switch diagrams" → file in [`remark-dgmo`](https://github.com/diagrammo/remark-dgmo/issues) (the CSS lives there)
        - "`astro build` errors" → file in [`astro-dgmo`](https://github.com/diagrammo/astro-dgmo/issues)
        We'll re-route mistakes silently — no need to repost.
  - type: textarea
    id: symptom
    attributes:
      label: What happened?
      description: Brief description of the actual vs expected behavior.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimum reproduction
      description: A minimal `docusaurus.config.ts` plus an MDX snippet that reproduces the bug.
      render: markdown
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: "docusaurus-plugin-dgmo, remark-dgmo, @diagrammo/dgmo, @docusaurus/core, Node"
      placeholder: "docusaurus-plugin-dgmo 0.1.0; remark-dgmo 0.1.0; @diagrammo/dgmo 0.15.2; @docusaurus/core 3.10.1; node 20.10"
    validations:
      required: true
