name: Release

# 🔴 THIS WORKFLOW IS THE PUBLISHER as of 2026-08-14. It authenticates to npm
# over Trusted Publishing (OIDC) — there is no stored credential anywhere, and
# the local `npm publish` path it replaced is going away: npm strips direct
# publish from bypass-2FA tokens in January 2027.
# https://github.blog/changelog/2026-07-31-restricting-npm-bypass-2fa-granular-access-tokens/
#
# 🔴 The trusted-publisher registration on npmjs.com names this REPO and this
# FILENAME. Renaming or moving this file stops publishing until someone updates
# the registration by hand at npmjs.com → the package → Settings → Trusted
# publisher. A token cannot do it — npm removed that power from bypass-2FA
# tokens on 2026-07-31.
#
# Dispatch-only on purpose: `scripts/release.sh` in the workspace bumps, tags,
# pushes, and then dispatches this workflow at the tag. By hand:
#   gh workflow run release.yml -R diagrammo/docusaurus-plugin-dgmo --ref vX.Y.Z
#
# Actions minutes: this repo is PUBLIC, so runs are free. The tag trigger came
# off 2026-07-22 to save minutes that were never being billed (verified
# 2026-08-14) — the cost worth avoiding is a run firing twice, not its minutes.
#
# 🔴 The note that used to sit here — "the org NPM_TOKEN is broken" — was a WRONG
# DIAGNOSIS, retracted 2026-07-31. No workflow in this repo has read a token
# since. A red run saying "cannot publish over the previously published
# versions" means a local publish beat CI to it; read the run's own log.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release, e.g. v0.8.3. Leave blank when dispatching on a tag ref.'
        required: false
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      # Dispatching at a tag ref makes GITHUB_REF_NAME the tag; the `tag` input
      # is the escape hatch for a dispatch from a branch. Everything downstream
      # reads these outputs rather than GITHUB_REF_NAME, so a run started the
      # wrong way fails here with a readable message instead of publishing a
      # version named `main`.
      - name: Resolve the tag being released
        id: target
        run: |
          TAG="${{ inputs.tag }}"
          [ -n "$TAG" ] || TAG="$GITHUB_REF_NAME"
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "::error::'$TAG' is not a version tag. Dispatch on a tag ref, or pass tag=vX.Y.Z."; exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "Releasing $TAG"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.target.outputs.tag }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - name: Verify tag matches package.json
        run: |
          TAG_VERSION="${{ steps.target.outputs.version }}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "tag=$TAG_VERSION pkg=$PKG_VERSION"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Version mismatch — bump package.json to $TAG_VERSION before tagging."
            exit 1
          fi

      - name: Guard against dev-loop leakage
        run: |
          if node -p 'JSON.stringify(require("./package.json"))' | grep -qE '"(remark-dgmo|docusaurus-plugin-dgmo)":\s*"(file:|link:)'; then
            echo "::error::package.json contains file:/link: deps. Swap to ^x.y.z before tagging."
            exit 1
          fi
          if node -p 'Object.keys(require("./package.json").pnpm ?? {}).join(",")' | grep -q overrides; then
            echo "::error::pnpm.overrides leaked into package.json — see RELEASE_CHECKLIST.md"
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build first: the fixture-config test dynamically imports
      # tests/fixture/docusaurus.config.ts, which self-imports
      # `docusaurus-plugin-dgmo/config` via the package's export map
      # (./dist/config.js). Without dist/, both typecheck and test fail.
      - name: Build
        run: pnpm build

      # The fixture has its own package.json declaring
      # `docusaurus-plugin-dgmo: link:../..`; locally pnpm creates the
      # `tests/fixture/node_modules/docusaurus-plugin-dgmo` symlink, and
      # both tsc and vitest follow it to resolve the self-import. CI
      # only installs root deps, so we stub the symlink directly rather
      # than running a 12k-line fixture install.
      - name: Stub fixture self-link
        run: mkdir -p tests/fixture/node_modules && ln -sfn ../../.. tests/fixture/node_modules/docusaurus-plugin-dgmo

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # tests/fixture/ build is currently blocked by two cascading
      # Docusaurus 3.10.1 SSG bugs (both reproduce on Node 22/24/25):
      #
      # 1. `@docusaurus/core/lib/ssg/ssgNodeRequire.js` builds a fake
      #    `require()` for the eval'd server bundle and forwards
      #    `.resolve`, `.cache`, `.extensions`, `.main` — but NOT
      #    `.resolveWeak`. Docusaurus's auto-generated `registry.js`
      #    (codegenRoutes.js:202) calls `require.resolveWeak("...")`
      #    at module-eval time, so the bundle aborts with
      #    `TypeError: require.resolveWeak is not a function`. A
      #    1-line shim — `ssgRequireFunction.resolveWeak = (id) => id;`
      #    — advances past this; the return value is only used as a
      #    registry key, so any identity-like impl is fine.
      #
      # 2. After fixing (1) locally we hit a second bug: the server
      #    bundle eagerly `require()`s raw CSS files
      #    (e.g. infima/dist/css/default/default.css), which Node's
      #    CJS loader can't parse (`SyntaxError: Unexpected token ':'`
      #    on `:root`). The server webpack config should null-loader
      #    those imports; needs deeper config work.
      #
      # Webpack/Rspack compile succeed in both cases — the errors live
      # in Docusaurus's SSG eval runtime, not in this plugin. Re-enable
      # the steps below once Docusaurus ships a fix or we adopt a
      # workaround in a custom plugin hook.
      # - name: Fixture build (Webpack)
      #   run: pnpm test:e2e
      # - name: Fixture build (Rspack)
      #   run: pnpm test:e2e:rspack

      # Re-running a release must be safe. npm rejects a duplicate version with
      # "You cannot publish over the previously published versions", which reads
      # as a credential failure and has been misread as one here before.
      - name: Is this version already on npm?
        id: npm_state
        run: |
          VERSION="${{ steps.target.outputs.version }}"
          if npm view "docusaurus-plugin-dgmo@$VERSION" version >/dev/null 2>&1; then
            echo "already=true" >> "$GITHUB_OUTPUT"
            echo "✓ npm already has $VERSION — skipping the publish"
          else
            echo "already=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        # OIDC via npm Trusted Publishing (configured per-package on
        # npmjs.com). No stored token; provenance is attested automatically.
        if: steps.npm_state.outputs.already == 'false'
        run: npm publish --access public --provenance

      - name: Wait for npm propagation
        if: steps.npm_state.outputs.already == 'false'
        run: |
          for i in 1 2 3 4 5 6; do
            if npm view "docusaurus-plugin-dgmo@${{ steps.target.outputs.version }}" version >/dev/null 2>&1; then
              echo "✓ npm shows ${{ steps.target.outputs.version }}"
              exit 0
            fi
            echo "Waiting for npm registry... ($i/6)"
            sleep 10
          done
          echo "::warning::npm did not surface the new version within 60s — proceeding anyway"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.target.outputs.tag }}
          generate_release_notes: true
