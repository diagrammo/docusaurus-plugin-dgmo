name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PAGES_BASE: /docusaurus-plugin-dgmo/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 10

      # Node 20: Docusaurus 3.10 static export is verified on 20. The showcase
      # is a standalone clean project (showcase/), NOT tests/fixture — the
      # eval-based Docusaurus SSG trips on the fixture's dependency tree.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 20

      - name: Pull showcase content (live links + all chart types from dgmo-content)
        run: |
          # pipefail: without it a failed curl exits 0 through sed, and the page
          # deploys with its gallery silently missing.
          set -euo pipefail
          BASE=https://raw.githubusercontent.com/diagrammo/dgmo-content/main/examples
          printf -- '---\nslug: /\ntitle: Live links and every chart type\n---\n' > showcase/docs/intro.md
          # The live-link section leads: it is the one thing this integration
          # does that pasting a picture into a docs folder cannot. NO sed here —
          # its fences stay in diagram mode, because the whole demonstration is
          # that the source is not on the page, and a "view source" footer would
          # undercut it.
          curl -fsSL "$BASE/docs/live-links.md" >> showcase/docs/intro.md
          printf '\n' >> showcase/docs/intro.md
          # sed: drop the H1 (line 1), then force every bare ```dgmo fence into
          # showcase mode so the deployed gallery demonstrates the hover-reveal
          # footer (source + copy + open-in-editor). Diagram mode ships no footer.
          curl -fsSL "$BASE/all-chart-types.md" | sed -e '1d' -e 's/^```dgmo$/```dgmo showcase/' >> showcase/docs/intro.md

      - name: Install showcase deps (latest published dgmo + plugin)
        run: cd showcase && pnpm install --no-frozen-lockfile

      - name: Build showcase
        run: cd showcase && pnpm exec docusaurus build

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: showcase/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
