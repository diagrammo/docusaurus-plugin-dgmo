name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PAGES_BASE: /docusaurus-plugin-dgmo/
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          version: 10

      # Node 20: Docusaurus 3.10 static export is verified on 20. The showcase
      # is a standalone clean project (showcase/), NOT tests/fixture — the
      # eval-based Docusaurus SSG trips on the fixture's dependency tree.
      - uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Pull showcase content (all chart types from dgmo-content)
        run: |
          printf -- '---\nslug: /\ntitle: All chart types\n---\n' > showcase/docs/intro.md
          curl -fsSL https://raw.githubusercontent.com/diagrammo/dgmo-content/main/examples/all-chart-types.md | sed '1d' >> showcase/docs/intro.md

      - name: Install showcase deps (latest published dgmo + plugin)
        run: cd showcase && pnpm install --no-frozen-lockfile

      - name: Build showcase
        run: cd showcase && pnpm exec docusaurus build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: showcase/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
