name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v5
        with:
          version: 10

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # knip/jscpd/depcheck analyze source + package.json only — no dist or
      # fixture stub needed, so the trio runs right after install.
      - name: Hygiene checks (formatting, dead code, duplication, deps)
        run: pnpm check:all

      # Build first: the fixture-config test dynamically imports
      # tests/fixture/docusaurus.config.ts, which self-imports
      # `docusaurus-plugin-dgmo/config` via the package's export map
      # (./dist/config.js). Without dist/, both typecheck and test fail.
      - name: Build
        run: pnpm build

      # The fixture has its own package.json declaring
      # `docusaurus-plugin-dgmo: link:../..`; locally pnpm creates the
      # `tests/fixture/node_modules/docusaurus-plugin-dgmo` symlink, and
      # both tsc and vitest follow it to resolve the self-import. CI
      # only installs root deps, so we stub the symlink directly rather
      # than running a 12k-line fixture install.
      - name: Stub fixture self-link
        run: mkdir -p tests/fixture/node_modules && ln -sfn ../../.. tests/fixture/node_modules/docusaurus-plugin-dgmo

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # The `require.resolveWeak is not a function` SSG failure was NOT a
      # Docusaurus bug — it was `"type": "module"` in the fixture package.json:
      # Docusaurus's eval-based SSG can't supply webpack's require.resolveWeak
      # to a server bundle evaluated in an ESM package context. Removing
      # `type: module` (the fixture is CJS; the .ts config loads via jiti
      # regardless) fixes it. The companion localStorage/requestAnimationFrame
      # crashes were dgmo leaking jsdom globals (fixed in @diagrammo/dgmo
      # 0.25.5). Webpack path re-enabled below.
      - name: Fixture build (Webpack)
        run: pnpm test:e2e
      # Rspack path (AC-DC4) stays disabled: it needs @docusaurus/faster +
      # `future.experimental_faster.ssgWorkerThreads` wiring not present here.
      # - name: Fixture build (Rspack)
      #   run: pnpm test:e2e:rspack
